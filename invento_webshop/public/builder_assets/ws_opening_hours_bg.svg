  <line x1="210" y1="310" x2="286" y2="73"  stroke="#DB2777" stroke-width="0.8" stroke-linecap="round" opacity="0.20"/>
  <line x1="210" y1="310" x2="134" y2="73"  stroke="#DB2777" stroke-width="0.8" stroke-linecap="round" opacity="0.20"/>
  <line x1="210" y1="310" x2="332" y2="152" stroke="#BE185D" stroke-width="0.8" stroke-linecap="round" opacity="0.17"/>
