  <line x1="210" y1="310" x2="53"  y2="213" stroke="#EC4899" stroke-width="0.8" stroke-linecap="round" opacity="0.15"/>
  <line x1="210" y1="310" x2="393" y2="257" stroke="#EC4899" stroke-width="0.8" stroke-linecap="round" opacity="0.13"/>
